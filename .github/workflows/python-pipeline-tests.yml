name: Python pipeline tests

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  machine-readable-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest ruff==0.15.22 jsonschema

      - name: Run automation and evidence tests
        run: >-
          python -m pytest -q
          tests/test_automation_pipeline.py
          tests/test_evidence.py
          tests/test_schemas.py

      - name: Lint the machine-readable pipeline
        run: >-
          python -m ruff check
          agentic_researcher
          research_pipeline
          tests/test_automation_pipeline.py
          tests/test_evidence.py
          tests/test_schemas.py
